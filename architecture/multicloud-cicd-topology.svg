<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 920" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="secretGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tccGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="idcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <linearGradient id="sreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1300" height="920" fill="url(#bg)" />

  <!-- Header -->
  <text x="650" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    Multi-Cloud Enterprise CI/CD Zero-Trust Architecture Blueprint
  </text>
  <text x="650" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    AWS (EKS) • Tencent Cloud (TKE) • Bare-Metal IDC • ESO In-Memory Identity • Non-Interactive Triage
  </text>

  <!-- 1. Git & Governance Layer -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="370" height="230" rx="12" fill="#111827" stroke="#374151" stroke-width="2" />
    <rect x="40" y="100" width="370" height="34" rx="12" fill="#1f2937" />
    <text x="225" y="123" font-family="sans-serif" font-size="13" font-weight="bold" fill="#93c5fd" text-anchor="middle">Git &amp; Governance Layer (Zero-ClickOps)</text>

    <rect x="60" y="150" width="330" height="46" rx="6" fill="#1e293b" />
    <text x="75" y="172" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">GitHub Enterprise Repositories</text>
    <text x="75" y="188" font-family="sans-serif" font-size="10" fill="#94a3b8">Branch Protections, Signed Commits &amp; SemVer</text>

    <rect x="60" y="206" width="330" height="46" rx="6" fill="#1e293b" />
    <text x="75" y="228" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">PR + AIOps Drift Validator</text>
    <text x="75" y="244" font-family="sans-serif" font-size="10" fill="#38bdf8">Automated Conftest / OPA Policy Evaluation</text>

    <rect x="60" y="262" width="330" height="52" rx="6" fill="url(#gitGrad)" stroke="#475569" stroke-width="1" />
    <text x="75" y="284" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Terraform Cloud Workflows</text>
    <text x="75" y="300" font-family="sans-serif" font-size="10" fill="#cbd5e1">Declarative Remote Runners • No Direct Console Writes</text>
  </g>

  <!-- 2. Secret & Identity Fabric -->
  <g filter="url(#shadow)">
    <rect x="440" y="100" width="420" height="230" rx="12" fill="#064e3b" stroke="#059669" stroke-width="2" fill-opacity="0.2" />
    <rect x="440" y="100" width="420" height="34" rx="12" fill="#064e3b" />
    <text x="650" y="123" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Secret &amp; Identity Fabric (Zero-Trust Decoupling)</text>

    <rect x="460" y="150" width="380" height="46" rx="6" fill="#065f46" />
    <text x="475" y="172" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">AWS SSM Parameter Store &amp; KMS</text>
    <text x="475" y="188" font-family="sans-serif" font-size="10" fill="#d1fae5">IAM Roles for Service Accounts (IRSA / Pod Identity)</text>

    <rect x="460" y="206" width="380" height="46" rx="6" fill="#065f46" />
    <text x="475" y="228" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0">Tencent Cloud KMS &amp; Secret Manager</text>
    <text x="475" y="244" font-family="sans-serif" font-size="10" fill="#d1fae5">RoleArn STS Dynamic Token Exchange</text>

    <rect x="460" y="262" width="380" height="52" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="475" y="284" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">HashiCorp Vault / Enterprise PKI</text>
    <text x="475" y="300" font-family="sans-serif" font-size="10" fill="#d1fae5">Dynamic Short-Lived Certificates &amp; On-Premise Auth</text>
  </g>

  <!-- 3. Enterprise CI/CD Control Plane -->
  <g filter="url(#shadow)">
    <rect x="890" y="100" width="370" height="230" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" fill-opacity="0.2" />
    <rect x="890" y="100" width="370" height="34" rx="12" fill="#1e3a8a" />
    <text x="1075" y="123" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Central CI/CD Control Plane</text>

    <rect x="910" y="150" width="330" height="164" rx="8" fill="url(#cpGrad)" />
    <text x="930" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">CloudBees Operations Center (OC)</text>
    <text x="930" y="206" font-family="sans-serif" font-size="11" fill="#dbeafe">• Central RBAC, Licensing &amp; Compliance Audit</text>
    <text x="930" y="228" font-family="sans-serif" font-size="11" fill="#dbeafe">• Global Configuration-as-Code (CasC) Bundles</text>
    <text x="930" y="250" font-family="sans-serif" font-size="11" fill="#dbeafe">• JNLP / mTLS Cluster-to-Cluster Mesh</text>
    <text x="930" y="272" font-family="sans-serif" font-size="11" fill="#dbeafe">• Automated Controller Health Keepalives</text>
    <text x="930" y="294" font-family="sans-serif" font-size="11" fill="#93c5fd">⚡ Managed Declaratively via Terraform Helm</text>
  </g>

  <!-- 4. Multi-Cloud Kubernetes Data Planes -->
  <g filter="url(#shadow)">
    <rect x="40" y="360" width="1220" height="340" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="40" y="360" width="1220" height="36" rx="14" fill="#334155" />
    <text x="650" y="384" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      Multi-Cloud Kubernetes Data Planes (Zero-Trust Workload Execution)
    </text>

    <!-- Estate 1: AWS EKS -->
    <rect x="65" y="416" width="365" height="260" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="65" y="416" width="365" height="30" rx="10" fill="#b45309" />
    <text x="247" y="436" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Estate (EKS 1.28+)</text>
    
    <rect x="80" y="456" width="335" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="92" y="474" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">External Secrets Operator (ESO)</text>
    <text x="92" y="489" font-family="sans-serif" font-size="9" fill="#94a3b8">SSM Provider Sync ➔ In-Memory K8s Secrets</text>

    <rect x="80" y="508" width="335" height="80" rx="6" fill="url(#awsGrad)" />
    <text x="92" y="528" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">CloudBees MC (AWS Apps)</text>
    <text x="92" y="546" font-family="sans-serif" font-size="10" fill="#fef3c7">Non-root (1000) • Read-only Root FS • Drop ALL</text>
    <text x="92" y="562" font-family="sans-serif" font-size="10" fill="#fef3c7">Dynamic CasC Injected via ConfigMap</text>
    <text x="92" y="578" font-family="sans-serif" font-size="10" fill="#ffffff">JNLP Tunnel ➔ Operations Center</text>

    <rect x="80" y="598" width="335" height="60" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="92" y="618" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">Ephemeral Dynamic Build Pods</text>
    <text x="92" y="634" font-family="sans-serif" font-size="9" fill="#94a3b8">Isolated build namespaces • Temporary IAM sessions</text>
    <text x="92" y="648" font-family="sans-serif" font-size="9" fill="#f87171">Stderr piped to Diagnostic Log Collector</text>

    <!-- Estate 2: Tencent Cloud TKE -->
    <rect x="465" y="416" width="370" height="260" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <rect x="465" y="416" width="370" height="30" rx="10" fill="#7e22ce" />
    <text x="650" y="436" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Tencent Cloud Estate (TKE)</text>

    <rect x="480" y="456" width="340" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="492" y="474" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">External Secrets Operator (ESO)</text>
    <text x="492" y="489" font-family="sans-serif" font-size="9" fill="#94a3b8">Tencent KMS Provider ➔ In-Memory K8s Secrets</text>

    <rect x="480" y="508" width="340" height="80" rx="6" fill="url(#tccGrad)" />
    <text x="492" y="528" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">CloudBees MC (Core Platform)</text>
    <text x="492" y="546" font-family="sans-serif" font-size="10" fill="#f3e8ff">Hardened CIS Security Profiles • Seccomp Default</text>
    <text x="492" y="562" font-family="sans-serif" font-size="10" fill="#f3e8ff">Immutable Packer Golden Node Images</text>
    <text x="492" y="578" font-family="sans-serif" font-size="10" fill="#ffffff">Cross-Border Site-to-Site VPN / Direct Connect</text>

    <rect x="480" y="598" width="340" height="60" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="492" y="618" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">Ephemeral Dynamic Build Pods</text>
    <text x="492" y="634" font-family="sans-serif" font-size="9" fill="#94a3b8">Native K8s plugin scheduling • Auto-pruned</text>
    <text x="492" y="648" font-family="sans-serif" font-size="9" fill="#f87171">Crash diagnostic hooks active</text>

    <!-- Estate 3: On-Premises IDC Bare Metal -->
    <rect x="865" y="416" width="370" height="260" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="865" y="416" width="370" height="30" rx="10" fill="#475569" />
    <text x="1050" y="436" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">On-Premises IDC (Bare-Metal K8s)</text>

    <rect x="880" y="456" width="340" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="892" y="474" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">External Secrets Operator (ESO)</text>
    <text x="892" y="489" font-family="sans-serif" font-size="9" fill="#94a3b8">Vault Agent AppRole ➔ Dynamic Token Rotation</text>

    <rect x="880" y="508" width="340" height="80" rx="6" fill="url(#idcGrad)" />
    <text x="892" y="528" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">CloudBees MC (Legacy / Hybrid)</text>
    <text x="892" y="546" font-family="sans-serif" font-size="10" fill="#e2e8f0">Local SAN Storage • High Throughput Build Cache</text>
    <text x="892" y="562" font-family="sans-serif" font-size="10" fill="#e2e8f0">Air-Gapped Container Registry Sync</text>
    <text x="892" y="578" font-family="sans-serif" font-size="10" fill="#ffffff">Dedicated mTLS JNLP Bridge to Cloud OC</text>

    <rect x="880" y="598" width="340" height="60" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="892" y="618" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">Ephemeral Dynamic Build Pods</text>
    <text x="892" y="634" font-family="sans-serif" font-size="9" fill="#94a3b8">Heavy compilation &amp; embedded firmware builds</text>
    <text x="892" y="648" font-family="sans-serif" font-size="9" fill="#f87171">Pod status streaming to Splunk</text>
  </g>

  <!-- 5. SRE & Non-Interactive Observability -->
  <g filter="url(#shadow)">
    <rect x="40" y="730" width="1220" height="150" rx="12" fill="#111827" stroke="#db2777" stroke-width="2" />
    <rect x="40" y="730" width="1220" height="32" rx="12" fill="#9d174d" />
    <text x="650" y="752" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      SRE Telemetry &amp; Non-Interactive Diagnostic Pipeline (Zero-Exec Policy)
    </text>

    <rect x="65" y="780" width="570" height="80" rx="8" fill="url(#sreGrad)" />
    <text x="85" y="805" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Terraform Cloud Diagnostic Hooks &amp; non-interactive-diag.sh</text>
    <text x="85" y="825" font-family="sans-serif" font-size="11" fill="#fce7f3">• Extracts .status.containerStatuses without requiring interactive shell (kubectl exec)</text>
    <text x="85" y="843" font-family="sans-serif" font-size="11" fill="#fce7f3">• Captures terminated.exitCode and streams previous stderr directly to TFC console &amp; SRE slack</text>

    <rect x="665" y="780" width="570" height="80" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
    <text x="685" y="805" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Enterprise Splunk &amp; Prometheus Alerting</text>
    <text x="685" y="825" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Centralized audit trail for all GitOps changes and ESO secret reconciliations</text>
    <text x="685" y="843" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Google SRE multi-window burn rate alerts (1h 14.4x, 6h 6x) across all hybrid clusters</text>
  </g>
</svg>
